name: Kernel Autobuild

on:
  push:
    branches: [ main, OpKona ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL_DIR: ${{ github.workspace }}
      DEFCONFIG: vendor/kona-perf_defconfig
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: ${{ github.workspace }}/out
      JOBS: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git wget curl ca-certificates bc bison flex \
            python3 python3-pip python3-setuptools zip unzip ncurses-dev \
            libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu rsync

      - name: Disable OPLUS Anti-Root Security Guards
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          
          if [ -f OplusKernelEnvConfig.mk ]; then
            echo "[+] Bypassing security checks in OplusKernelEnvConfig.mk"
            sed -i 's/ifeq (\$(OPLUS_FEATURE_SECURE_ROOTGUARD),yes)/ifeq (\$(OPLUS_FEATURE_SECURE_ROOTGUARD),no)/g' OplusKernelEnvConfig.mk
            sed -i 's/ifeq (\$(OPLUS_FEATURE_SECURE_EXECGUARD),yes)/ifeq (\$(OPLUS_FEATURE_SECURE_EXECGUARD),no)/g' OplusKernelEnvConfig.mk
            sed -i 's/ifeq (\$(OPLUS_FEATURE_SECURE_MOUNTGUARD),yes)/ifeq (\$(OPLUS_FEATURE_SECURE_MOUNTGUARD),no)/g' OplusKernelEnvConfig.mk
          fi

          TARGET_DEFCONFIG="arch/arm64/configs/$DEFCONFIG"
          if [ -f "$TARGET_DEFCONFIG" ]; then
            echo "[+] Disabling anti-root configs in defconfig"
            sed -i '/CONFIG_OPLUS_ROOT_CHECK/d' "$TARGET_DEFCONFIG"
            sed -i '/CONFIG_OPLUS_EXECVE_BLOCK/d' "$TARGET_DEFCONFIG"
            sed -i '/CONFIG_OPLUS_MOUNT_BLOCK/d' "$TARGET_DEFCONFIG"
            
            echo -e "\nCONFIG_OPLUS_ROOT_CHECK=n\nCONFIG_OPLUS_EXECVE_BLOCK=n\nCONFIG_OPLUS_MOUNT_BLOCK=n" >> "$TARGET_DEFCONFIG"
          fi

      - name: Fix Legacy Python Scripts
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i "s/print \\([^,]*\\),/print(\\1,end=' ')/g" scripts/gcc-wrapper.py || true
            sed -i 's/print \(.*\)/print(\1)/g' scripts/gcc-wrapper.py || true
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          cd "$KERNEL_DIR"
          
          # First initialize the base template parameters
          make O="$OUT_DIR" ARCH=arm64 "$DEFCONFIG"
          
          # Automatically inject safe default values for all new unmapped CPU features
          make O="$OUT_DIR" ARCH=arm64 olddefconfig
          
          # Execute the core toolchain compilation cleanly
          make O="$OUT_DIR" -j"$JOBS" ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w" \
            ccache=n \
            USE_CCACHE=0

      - name: Package AnyKernel3 Zip Artifact
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md || true
          
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "$OUT_DIR/arch/arm64/boot/Image-dtb" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image-dtb" AnyKernel3/
          else
            cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 ../OnePlus9R-Kernel-Finished.zip .

      - name: Upload Finished Flashable Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9R-Kernel-Finished
          path: OnePlus9R-Kernel-Finished.zip
